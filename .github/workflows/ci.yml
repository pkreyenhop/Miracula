name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go test -race ./...
      - run: go run ./cmd/checkdag
      - run: go generate ./...
      - run: git diff --exit-code
      - run: python3 tests/test_go_command.py
      - run: python3 tests/test_go_repl.py
      - run: python3 tests/test_go_install.py
      - run: python3 scripts/package_go.py build --output build/mira
      - run: python3 tests/startup_from_source.py build/mira
