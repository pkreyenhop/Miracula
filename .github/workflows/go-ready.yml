name: Go migration readiness

on:
  push:
  pull_request:

jobs:
  go-ready:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build go-ready --summary failures
